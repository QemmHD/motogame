<!doctype html>
<html>
<head>

<meta name="theme-color" content="#1b1f2a">
<title>Moto Rush X3</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12141d;

  #c { display: block; width: 100vw; height: 100vh; }

    display: none; text-shadow: 0 1px 2px #000; z-index: 10; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffd23e; font-weight: 800; letter-spacing: 2px; background: #12141d; z-index: 5; }
</style>
