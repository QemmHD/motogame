name: Publish game to gh-pages

# Auto-updates the live game on every push: splits the static site in public/
# out to the `gh-pages` branch (game at root) and force-pushes it. The live
# URL (raw.githack.com/<owner>/motogame/gh-pages/index.html) then serves the
# latest build with no manual step. No GitHub Pages enablement required — this
# only pushes a branch, which the default GITHUB_TOKEN is allowed to do.

on:
  push:
    branches: [main, claude/moto-x3m-bike-game-ipwi7p]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so `subtree split` works
      - name: Split public/ and force-push to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix public -b gh-pages-tmp
          git push origin gh-pages-tmp:gh-pages --force
          git branch -D gh-pages-tmp
