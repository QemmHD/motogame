name: Test and publish game

# Pull requests into main run the release gate. Only a successful push to main
# may publish public/ to gh-pages; manual runs are test-only.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned test tooling
        run: npm ci --ignore-scripts
      - name: Run release-gate tests
        run: npm test

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split public/ and force-push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix public -b gh-pages-tmp
          git push origin gh-pages-tmp:gh-pages --force
          git branch -D gh-pages-tmp
